short_bio: >-
  <p>I am a Research Scientist at <b class="brand-bytebrain">ByteBrain</b>, the AI for Infrastructure (AI4Infra) platform at <a href="https://www.bytedance.com/">ByteDance</a>, based in San Jose, CA, USA.</p>
  <p>My research focuses on <b class="kw-devops">AI for DevOps</b>: the half of software delivery that comes <strong class="kw-claim">after the code</strong>.
  As coding agents accelerate development, the bottleneck moves to verification, deployment, and operations.
  <br>
  I envision a <strong class="kw-claim">self-evolving</strong> software system where <strong class="kw-thesis">trust comes from the delivery loop, not human review</strong>: every change is verified before it ships, deployment is gated by its <span class="kw-line kw-line--risk">risk</span>, and production returns <span class="kw-line kw-line--feedback">feedback</span> and <span class="kw-line kw-line--knowledge">knowledge</span> for the next change.
  The open questions are <strong class="kw-claim">how far this loop can run</strong> before humans get involved, and what an <strong class="kw-claim">agent-native environment</strong>, built for agents, not developers, must provide to run&nbsp;it.</p>
  <p>I received my Ph.D. in Computer Science and Engineering from The Chinese University of Hong Kong, advised by <a href="https://www.cse.cuhk.edu.hk/lyu/">Prof. Michael R. Lyu</a> in the <a href="http://ariselab.cse.cuhk.edu.hk/">ARISE Lab</a>.
  <br>
  My doctoral research established a <strong class="kw-claim">mutually reinforcing cycle</strong> between LLMs and operations: using LLMs to automate large-scale cloud operations (<b class="kw-llm4ops">LLM4Ops</b>) and making LLM systems themselves observable and reliable (<b class="kw-ops4llm">Ops4LLM</b>).</p>
  <p class="hero-bio__invite">I am always open to discussions and collaborations. Feel free to drop me an email if you would like to connect.</p>

